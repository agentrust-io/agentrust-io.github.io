name: WCM redirect

on:
  pull_request:
    paths:
      - "wcm/**"
      - ".github/workflows/wcm-redirect.yml"
  push:
    branches: [main]
    paths:
      - "wcm/**"
      - ".github/workflows/wcm-redirect.yml"

permissions:
  contents: read

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node wcm/redirect.test.js
