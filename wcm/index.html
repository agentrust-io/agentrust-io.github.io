<!--

  agentrust-io/weight-custody-manifest.

  This path used to host a separate launch page, from the period when the WCM
  repository was private and GitHub Pages could not publish it. That page and the
  docs site then drifted into two different homepages for one project, disagreeing
  on the SDK version. The launch page's content now lives on the docs home.

  Keep this file as a redirect. Do not restore content here: a second page at this
  address is the drift. The Open Graph tags below point at the docs site so a
  crawler that lands on an old share resolves to the same card.

  og-launch.png stays in this directory. Cards cached against
  agentrust-io.com/wcm/og-launch.png still resolve, and nothing rewrites that path.
-->
